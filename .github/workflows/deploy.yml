# Build and push the image, then deploy api + worker to Cloud Run.
# main → staging automatically; tags v* → production after manual approval
# (GitHub environment "production" with required reviewers). Secrets and variables are referenced
# by name only; GCP auth uses Workload Identity Federation (no JSON keys).
name: deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - id: meta
        run: echo "image=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/nouri/backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy worker, then api
        run: |
          gcloud run deploy nouri-worker-staging --image "${{ needs.build.outputs.image }}" --region "${{ vars.GCP_REGION }}" --project "${{ vars.GCP_PROJECT_ID }}" --quiet
          gcloud run deploy nouri-api-staging --image "${{ needs.build.outputs.image }}" --region "${{ vars.GCP_REGION }}" --project "${{ vars.GCP_PROJECT_ID }}" --quiet
      - name: Smoke test
        run: curl --fail --retry 5 --retry-delay 5 "${{ vars.API_BASE_URL }}/v1/health"

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    environment: production # required reviewers = manual approval
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy with no traffic, then shift (rollback = move traffic back)
        run: |
          gcloud run deploy nouri-worker-prod --image "${{ needs.build.outputs.image }}" --region "${{ vars.GCP_REGION }}" --project "${{ vars.GCP_PROJECT_ID }}" --quiet
          gcloud run deploy nouri-api-prod --image "${{ needs.build.outputs.image }}" --region "${{ vars.GCP_REGION }}" --project "${{ vars.GCP_PROJECT_ID }}" --no-traffic --tag "rel-${GITHUB_SHA::7}" --quiet
          curl --fail --retry 5 --retry-delay 5 "https://rel-${GITHUB_SHA::7}---${{ vars.API_RUN_HOST }}/v1/health"
          gcloud run services update-traffic nouri-api-prod --to-latest --region "${{ vars.GCP_REGION }}" --project "${{ vars.GCP_PROJECT_ID }}" --quiet
      - name: Smoke test
        run: curl --fail --retry 5 --retry-delay 5 "${{ vars.API_BASE_URL }}/v1/health"
