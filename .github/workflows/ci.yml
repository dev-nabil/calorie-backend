# M0-T6: lint, typecheck, unit + e2e tests (in-memory MongoDB, no Docker services), build and
# OpenAPI drift check. Runs on every PR and on main. Deploys are Render's (render.yaml), not CI's.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MONGOMS_VERSION: 8.2.6
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache MongoDB binaries (mongodb-memory-server)
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-${{ runner.os }}-${{ env.MONGOMS_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Validate product content
        run: pnpm content:validate
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests (coverage gate on src/domain)
        run: pnpm test:unit --coverage
      - name: E2E tests
        run: pnpm test:e2e
      - run: pnpm build
      - name: OpenAPI drift check
        run: |
          pnpm openapi
          git diff --exit-code -- openapi/openapi.json || {
            echo "::error::openapi/openapi.json is out of date. Run 'pnpm openapi' and commit the result."
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi/openapi.json
          if-no-files-found: error

  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
      - run: terraform fmt -check -recursive
      - name: Validate each environment (no backend, no credentials)
        run: |
          for env in envs/staging envs/prod; do
            terraform -chdir=$env init -backend=false -input=false
            terraform -chdir=$env validate
          done
