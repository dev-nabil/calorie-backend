# Render Blueprint: the Nouri API as ONE free web service (native Node, no Docker, no Redis, no worker).
# The same process serves HTTP and runs every background job from a MongoDB queue.
# Step by step, what each value means, and how to go to production: DEPLOY-RENDER.md.
#
# Only secrets and the database URL are environment variables. Everything else (models, scan caps,
# Google/Apple client IDs, email sender, integrity, barcode lookups, admin URL) is an admin setting:
# admin panel → Settings, stored in MongoDB.
#
# This is a TEST server profile: NODE_ENV=development, because production mode refuses DEV_FIXED_OTP and
# ADMIN_TOTP_REQUIRED=false and turns the dev tools off (src/config/env.ts). The dev-only parts that would be unsafe on a public URL
# are switched off below (DEV_ROUTES, Swagger).
#
# Values marked `sync: false` are asked for in the Render dashboard when the Blueprint is created.
# Never put a real secret in this file.
services:
  - type: web
    name: nouri-api
    runtime: node
    plan: free
    region: singapore # closest to Bangladesh; pick the region of your MongoDB Atlas cluster if it differs
    branch: main
    autoDeploy: true
    # Node version comes from .nvmrc (22). devDependencies are needed to compile (tsc). The repo does not
    # track pnpm-lock.yaml (root .gitignore), so the build resolves versions fresh: --no-frozen-lockfile.
    buildCommand: npm install -g pnpm@10.27.0 && pnpm install --no-frozen-lockfile --prod=false && pnpm build
    startCommand: node dist/main.js
    healthCheckPath: /v1/health
    envVars:
      # ── Mode ───────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: development
      - key: DEV_ROUTES
        value: "false" # /v1/dev/* (read the last sign-in code, move the clock) must never be public
      - key: SWAGGER_ENABLED
        value: "false"
      # Skip the 100 MB test MongoDB download during the build (mongodb-memory-server is a dev tool).
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"

      # ── Database (MongoDB Atlas free M0) ──────────────────────────────────
      - key: MONGODB_URI
        sync: false # mongodb+srv://USER:PASSWORD@CLUSTER.mongodb.net/nouri?retryWrites=true&w=majority

      # ── Secrets: generated once by Render. Do not rotate LEDGER_PEPPER. ──
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: LEDGER_PEPPER
        generateValue: true

      # ── Keys (paste in the dashboard) ─────────────────────────────────────
      - key: GEMINI_API_KEY
        sync: false
      - key: EMAIL_API_KEY
        sync: false # Resend; empty = sign-in codes are printed in the Render log
      - key: CORS_ORIGINS
        sync: false # the admin panel / website origins, e.g. https://nouri-web.example.com

      # ── Photos ────────────────────────────────────────────────────────────
      # Without S3 keys photos go to the service's own disk, which Render wipes on every deploy and
      # spin-down. For photos that last, add Cloudflare R2 (free tier): S3_ENDPOINT, S3_REGION=auto,
      # S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY.
